<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BarberAntri — Mitra</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="app-bg">
<div class="phone partner-desk">
  <aside class="sidebar" id="snav">
    <b>💈 BarberAntri <span class="text-muted" style="font-weight:400">Mitra</span></b>
    <button data-v="v-dash" class="on">📊 Dashboard</button>
    <button data-v="v-list">📋 Antrean</button>
    <button data-v="v-report">📈 Laporan</button>
    <button data-v="v-actions">⚙️ Aksi & Layanan</button>
    <button class="btn-primary" onclick="openWalkin()">➕ Walk-in</button>
  </aside>
  <div class="partner-main">
  <div id="v-dash"></div>
  <div id="v-list" class="hidden"></div>
  <div id="v-actions" class="hidden"></div>
  <div id="v-report" class="hidden"></div>
  </div>
  <nav class="bottomnav" id="pnav">
    <button data-v="v-dash" class="on">📊<br>Dashboard</button>
    <button data-v="v-list">📋<br>Antrean</button>
    <button onclick="openWalkin()">➕<br>Walk-in</button>
    <button data-v="v-report">📈<br>Laporan</button>
    <button data-v="v-actions">⚙️<br>Aksi</button>
  </nav>
</div>
<div id="walkinModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center">
  <div class="card" style="width:100%;max-width:28rem;border-radius:1.25rem 1.25rem 0 0">
    <b>+ Tambah Walk-in</b>
    <label class="lbl">Nama pelanggan</label><input id="w-name" class="inp" value="Budi Santoso">
    <label class="lbl">No WhatsApp</label><input id="w-phone" class="inp" value="0813-2244-9988">
    <button class="btn-primary" onclick="saveWalkin()">+ Tambah Antrean</button>
    <button class="btn-ghost mt-2" onclick="document.getElementById('walkinModal').classList.add('hidden')">Tutup</button>
  </div>
</div>
<script src="fake_db.js"></script>
<script src="app.js"></script>
<script>
const s = FakeDB.require('mitra');
function show(id) {
  ['v-dash', 'v-list', 'v-actions', 'v-report'].forEach(v => document.getElementById(v).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('#pnav button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === id));
  document.querySelectorAll('#snav button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === id));
  window.scrollTo(0, 0);
}
  document.querySelectorAll('#pnav button[data-v]').forEach(b => b.onclick = () => { renderAll(); show(b.dataset.v); });
  document.querySelectorAll('#snav button[data-v]').forEach(b => b.onclick = () => { renderAll(); show(b.dataset.v); });
function renderAll() { renderDash(); renderList(); renderActions(); renderReport(); }
function renderDash() {
  const q = LiveQueue.load();
  document.getElementById('v-dash').innerHTML = `
    <h2 class="text-lg font-extrabold mt-4">💈 ${s.name}</h2>
    <span class="chip">MITRA AKTIF • Online Open</span>
    <div class="dash-grid mt-2">
    <div>
    <div class="card-dark" style="text-align:center">
      <div class="text-xs opacity-70">ANTREAN SEDANG BERJALAN</div>
      <div style="font-size:2.5rem;font-weight:900">${q.nowServing}</div>
      <div class="text-sm opacity-70">Rian "The Razor" • Low Fade Cut</div>
      <div class="grid2 text-sm mt-2">
        <div>Berikutnya<br><b>${q.waiting[0]?.code || '-'}</b></div>
        <div>Menunggu<br><b>${q.waiting.length} Orang</b></div>
      </div>
    </div>
    <div class="grid2">
      <button class="btn-ghost" onclick="openWalkin()">👤 Input Walk-in</button>
      <button class="btn-ghost" onclick="callNext()">📢 Panggil Next</button>
    </div>
    </div>
    <div>
    <div class="card mt-3"><b>Status Kursi & Kapster</b>
      <div class="text-sm">🟢 Rian — Sibuk (~12mnt)</div>
      <div class="text-sm">🟢 Anton — Siap Panggil</div>
      <div class="text-sm">🟡 Ben — Break (15mnt)</div></div>
    </div></div>`;
}
function renderList() {
  const q = LiveQueue.load();
  document.getElementById('v-list').innerHTML = `
    <h2 class="text-lg font-extrabold mt-4">Daftar Antrean Real-Time</h2>
    <div class="card" style="background:#FFEDED"><b style="color:#E5484D">${q.nowServing} — Sedang Cukur</b><br>
      <span class="text-sm text-muted">Mulai 10:15 WIB • Estimasi selesai 10:35</span></div>
    <b>Antrean Menunggu (${q.waiting.length})</b>
    <div class="qlist-grid">
    ${q.waiting.map(w => `<div class="card text-sm"><b>${w.code}</b> • ${w.name}<br>
      <span class="text-muted">${w.service} • Kapster ${w.kapster}</span><br>
      <button class="chip mt-1" onclick="ticketDetail('${w.code}')">Kelola →</button></div>`).join('') || '<div class="card">Kosong 🎉</div>'}
    </div>
    <button class="chip" onclick="renderAll()">🔄 Refresh</button>`;
}
function ticketDetail(code) {
  const q = LiveQueue.load();
  const t = q.waiting.find(x => x.code === code);
  if (!t) return;
  document.getElementById('v-list').innerHTML = `
    <button class="chip mt-4" onclick="renderList()">← Daftar</button>
    <div class="card mt-2" style="text-align:center">
      <div class="text-xs text-muted">NOMOR GILIRAN ${t.code}</div>
      <div style="font-size:2.5rem;font-weight:900;color:#009E77">${t.code}</div>
      <div class="text-sm">${t.name}<br>${t.service} • Kapster ${t.kapster}</div>
      <span class="chip">Pengingat WA Terkirim ✓ (simulasi)</span>
    </div>
    <button class="btn-primary" onclick="callNext()">▶ Mulai Cukur</button>
    <button class="btn-ghost mt-2" onclick="callNext()">✔ Selesai</button>
    <button class="btn-ghost mt-2" style="color:#E5484D" onclick="callNext()">Batalkan Antrean</button>`;
}
function renderActions() {
  document.getElementById('v-actions').innerHTML = `
    <h2 class="text-lg font-extrabold mt-4">Manajemen Aksi Antrean</h2>
    <div class="card">🟢 <b>Status Sesi: Buka Antrean</b><br><span class="text-sm text-muted">Menerima online & offline</span></div>
    <div class="card">💬 <b>Kirim Pengingat WA Masal</b><br>
      <button class="chip mt-1" onclick="toast('WA masal ke 4 antrean terkirim (simulasi)')">Kirim</button></div>
    <div class="card">🔴 <b>Tutup Antrean / Istirahat</b></div>
    <b>Editor Layanan Aktif</b>
    <div class="card text-sm">Low Fade Cut — Rp50.000</div>
    <div class="card text-sm">French Crop — Rp55.000</div>`;
}
function renderReport() {
  document.getElementById('v-report').innerHTML = `
    <h2 class="text-lg font-extrabold mt-4">Laporan Performa Harian</h2>
    <div class="card" style="text-align:center">
      <div class="text-xs text-muted">RATA-RATA WAKTU MENUNGGU</div>
      <div style="font-size:2.25rem;font-weight:900;color:#009E77">15 Menit</div>
      <div class="text-sm">Rating ★ 4.8 • Pendapatan <b>Rp1,2jt</b></div></div>
    <b>Jam Sibuk (puncak 14.00)</b>
    <div style="display:flex;align-items:flex-end;height:110px;gap:6px">
      ${[[40, '10'], [60, '12'], [110, '14'], [70, '16'], [45, '18']].map(([h, l]) =>
        `<div style="flex:1;text-align:center"><div class="bar" style="height:${h}px;background:${h >= 100 ? '#00C896' : '#CDEFE3'}"></div><small>${l}</small></div>`).join('')}
    </div>
    <div class="card text-sm mt-2"><b>Performa Kapster</b><br>Rian (16 tamu) — Rp450rb<br>Anton (14 tamu) — Rp480rb<br>Ben (6 tamu) — Rp120rb</div>`;
}
function callNext() { const q = LiveQueue.callNext(); renderAll(); toast(`📢 ${q.nowServing} dipanggil (simulasi WS)`); }
function openWalkin() { document.getElementById('walkinModal').classList.remove('hidden'); document.getElementById('walkinModal').style.display = 'flex'; }
function saveWalkin() {
  const name = document.getElementById('w-name').value || 'Tamu';
  const code = LiveQueue.addWalkIn(name);
  document.getElementById('walkinModal').classList.add('hidden');
  document.getElementById('walkinModal').style.display = 'none';
  renderAll(); show('v-list'); toast(`${code} ditambah (${name})`);
}
document.getElementById('walkinModal').style.display = 'none';
renderAll();
</script>
</body>
</html>
